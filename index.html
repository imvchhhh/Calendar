<!DOCTYPE html>
<!--
  ================================================================
  INSTRUCCIONES — LEE ESTO ANTES DE PUBLICAR / EDITAR EL ARCHIVO
  ================================================================

  Este archivo ya trae 5 cambios respecto al original (buscados con
  "CAMBIO 1" ... "CAMBIO 5" dentro del CSS/JS):

  1) FONDO: la fotografía de Hogwarts que subiste ya está incrustada
     (comprimida a JPG y convertida a base64) como capa de fondo,
     con el color oscuro original (--bg) debajo como respaldo.
     → Para cambiarla por otra imagen: convierte tu nueva imagen a
       base64 (p.ej. en https://www.base64-image.de/), y reemplaza
       el contenido de la URL que empieza "data:image/jpeg;base64,"
       dentro de la regla `body{ background-image: ... }`.

  2) FUENTE DEL TÍTULO "Hogwarts" → Dumbledor
  5) FUENTE DE LA INICIAL DE CADA MES → Ghosthey

     Ninguna de las dos está en Google Fonts, así que hay que
     descargarlas manualmente e incrustarlas. Pasos:

     a) Entra a https://www.1001fonts.com/dumbledor-font.html y a
        https://www.1001fonts.com/ghosthey-font.html y descarga el
        .zip de cada una (botón "Download"). Revisa la licencia de
        uso que indica la página (uso personal / comercial) antes
        de usarla en tu proyecto.
     b) Descomprime cada .zip y ubica el archivo .ttf u .otf
        (normalmente "Dumbledor.ttf" y "GHOSTHEY.ttf" o similar).
     c) Conviértelo a base64 con un conversor online, por ejemplo
        https://www.base64encode.org/ (sube el .ttf, copia el
        resultado como texto).
     d) En este HTML, busca los dos bloques @font-face (justo
        después de las variables :root, marcados como "CAMBIO 2 y 5")
        y reemplaza "PEGAR-BASE64-DUMBLEDOR-AQUI" y
        "PEGAR-BASE64-GHOSTHEY-AQUI" por el texto base64 de cada
        fuente respectivamente.
     e) Alternativa más sencilla si vas a alojar el HTML en tu propio
        servidor (no como artefacto autónomo): en vez de base64,
        sube los archivos "Dumbledor.ttf" y "Ghosthey.ttf" en la
        misma carpeta que el HTML y cambia el `src` del @font-face a:
        src:url("Dumbledor.ttf") format('truetype');
     Mientras no rellenes el base64 (o el archivo), el título y las
     iniciales de mes se ven con la fuente gótica original —no se
     rompe nada, solo no cambia visualmente hasta que la agregues.

  3) TARJETAS DEL MODAL: ahora usan azul Ravenclaw (#0E1A40 /
     #1B3A6B) con ~0.75 de opacidad (vía rgba, para no afectar la
     lectura del texto).

  4) CURSOR: estrella mágica sutil (SVG incrustado), aplicada a
     todo el documento.

  ================================================================
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hogwarts — Pureblood Syndicate </title>

<!-- Tipografías: gótica para títulos y serif editorial para el contenido -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#e7e4d8;
  --ink-soft:#b9b9aa;
  --paper:#d7d4c4;
  --paper-dark:#aaa896;

  --bg:#080d0b;
  --bg-2:#0b120e;
  /* CAMBIO 6: paneles de las tarjetas de mes, antes verdes (#101713 / #141d17),
     ahora en azul manteniendo la misma luminosidad y estructura de degradado. */
  --panel:#0e1420;
  --panel-2:#152136;

  --green:#315d45;
  --green-light:#5f8c6e;
  --green-deep:#183526;
  --silver:#9da49c;

  --line:rgba(214,211,192,.30);
  --line-soft:rgba(214,211,192,.13);
  --glow:rgba(95,140,110,.18);

  --serif:'Cormorant Garamond', Georgia, serif;
  --blackletter:'UnifrakturMaguntia', 'Times New Roman', serif;
  --dumbledore:'Dumbledor', var(--blackletter); /* CAMBIO 2: ver instrucciones @font-face abajo */
  --ghosthey:'Ghosthey', var(--blackletter);    /* CAMBIO 5: ver instrucciones @font-face abajo */

  box-sizing:border-box;
}

/* =========================================================
   CAMBIO 2 y 5 — FUENTES DESCARGABLES (Dumbledor y Ghosthey)
   =========================================================
   Estas dos fuentes NO son de Google Fonts, así que no se pueden
   enlazar por URL: hay que descargarlas de 1001fonts e incrustarlas
   como base64 (o alojar el .ttf junto al HTML). Ver instrucciones
   completas en el comentario grande al INICIO del <head>.
   Debajo dejamos el @font-face ya listo: solo falta pegar tu base64
   donde dice "PEGAR-BASE64-AQUI". Si no lo rellenas, el navegador
   usa automáticamente el fallback (--blackletter) y nada se rompe. */
@font-face{
  font-family:'Dumbledor';
  src:url("data:font/truetype;base64,PEGAR-BASE64-DUMBLEDOR-AQUI") format('truetype');
  font-weight:normal;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:'Ghosthey';
  src:url("data:font/truetype;base64,PEGAR-BASE64-GHOSTHEY-AQUI") format('truetype');
  font-weight:normal;
  font-style:normal;
  font-display:swap;
}

*,
*::before,
*::after{box-sizing:border-box}

html{scroll-behavior:smooth}

/* CAMBIO 4 — Cursor personalizado tipo "estrella mágica".
   Es un SVG pequeño incrustado directamente (sin descargas): una
   estrella de 4 puntas sutil, dorada, con el punto de clic (hotspot)
   en su centro (12 12). `auto` al final es el respaldo si el
   navegador no soporta cursores SVG. Se aplica a todo el documento;
   los elementos con cursor:pointer (como .plaque) lo conservan. */
*{
  cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M12 1 L14 10 L23 12 L14 14 L12 23 L10 14 L1 12 L10 10 Z' fill='%23d7d4c4' fill-opacity='0.85' stroke='%23315d45' stroke-width='0.6'/></svg>") 12 12, auto;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:var(--serif);
  /* CAMBIO 1 — Fondo: color original como respaldo (background-color) +
     imagen de Hogwarts (embebida en base64 para que el archivo quede autónomo).
     Si por cualquier razón la imagen no decodifica, el color de --bg sigue
     visible debajo de todas las capas. Para usar OTRA imagen: reemplaza el
     texto largo que empieza con "data:image/jpeg;base64," (ver comentario
     "REEMPLAZAR IMAGEN" al final del <style>) por el de tu nuevo archivo. */

/* REEMPLAZAR IMAGEN: la cadena base64 anterior corresponde a la fotografía
   de Hogwarts que subiste (comprimida a JPG para que el archivo pese poco).
   Para cambiarla: convierte tu nueva imagen a base64 (por ejemplo con
   https://www.base64-image.de/) y sustituye todo el contenido entre
   comillas de la última línea de "background-image" arriba. */

/* Textura muy leve: evita el aspecto de "gradiente de IA" */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.035;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.5) 0 1px, transparent 1px 5px);
  mix-blend-mode:soft-light;
}

button{font:inherit}

.page{
  width:min(1280px, calc(100% - 34px));
  margin:0 auto;
  padding:38px 0 70px;
}

/* =========================
   CABECERA
   ========================= */

.header{
  position:relative;
  text-align:center;
  padding:8px 0 30px;
}

.header::before,
.header::after{
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:min(700px, 90%);
  height:1px;
  background:linear-gradient(90deg, transparent, var(--line), transparent);
}

.header::before{top:0}
.header::after{bottom:0}

.header-ornament{
  color:var(--silver);
  font-size:18px;
  letter-spacing:.55em;
  opacity:.72;
  margin-bottom:8px;
}

h1{
  margin:0;
  color:#f0eee5;
  font-family:var(--dumbledore); /* CAMBIO 2: antes var(--blackletter) */
  font-size:clamp(3rem, 8vw, 6.7rem);
  font-weight:400;
  line-height:.88;
  letter-spacing:.015em;
  text-shadow:0 1px 0 #000;
}

.subtitle{
  margin:15px 0 0;
  color:#aeb3a9;
  font-size:clamp(.95rem, 1.6vw, 1.2rem);
  font-style:italic;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.header-rule{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
  margin:18px auto 0;
  color:#9ea69d;
  opacity:.72;
}

.header-rule span{
  width:115px;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--line));
}

.header-rule span:last-child{
  transform:scaleX(-1);
}

.header-rule b{
  font-weight:400;
  font-size:15px;
}

/* =========================
   LIBRO / MESES
   ========================= */

.months{
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  gap:18px;
  margin-top:34px;
}

.month{
  position:relative;
  min-height:100%;
  padding:19px 16px 21px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.018), transparent 30%),
    linear-gradient(160deg, var(--panel-2), var(--panel));
  border:1px solid var(--line-soft);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.45),
    0 12px 30px rgba(0,0,0,.18);
}

.month::before{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid rgba(210,210,192,.09);
  pointer-events:none;
}

.month::after{
  content:"❦";
  position:absolute;
  left:50%;
  top:-12px;
  transform:translateX(-50%);
  padding:0 9px;
  color:#8e978d;
  background:var(--bg);
  font-size:18px;
  opacity:.8;
}

.month-head{
  position:relative;
  z-index:1;
  text-align:center;
  padding:0 4px 17px;
  border-bottom:1px solid var(--line-soft);
}

.month-number{
  display:block;
  color:#778078;
  font-size:.72rem;
  letter-spacing:.24em;
  text-transform:uppercase;
  margin-bottom:3px;
}

.month h2{
  margin:0;
  color:#e2e1d8;
  font-family:var(--blackletter);
  font-size:clamp(1.65rem, 2.4vw, 2.15rem);
  font-weight:400;
  line-height:1;
}

/* CAMBIO 5: solo la letra inicial del mes usa Ghosthey; el resto de
   la palabra conserva var(--blackletter) tal como estaba. */
.month h2::first-letter{
  font-family:var(--ghosthey);
  font-size:1.25em;
  color:#efeee6;
}

.rows{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-top:15px;
}

/* =========================
   EVENTOS
   ========================= */

.plaque{
  position:relative;
  display:grid;
  grid-template-columns:54px 1fr;
  align-items:center;
  gap:10px;
  min-height:72px;
  padding:9px 10px 9px 7px;
  color:var(--ink);
  background:
    linear-gradient(90deg, rgba(36,67,49,.13), transparent 55%),
    rgba(0,0,0,.14);
  border:1px solid transparent;
  border-left:1px solid rgba(105,134,114,.30);
  cursor:pointer;
  transition:
    transform .22s ease,
    background .22s ease,
    border-color .22s ease,
    box-shadow .22s ease;
}

.plaque::before{
  content:"";
  position:absolute;
  top:7px;
  bottom:7px;
  left:0;
  width:2px;
  background:var(--event-color, var(--green));
  opacity:.72;
}

.plaque:hover,
.plaque:focus-visible{
  transform:translateX(3px);
  background:
    linear-gradient(90deg, rgba(49,93,69,.24), transparent 70%),
    rgba(255,255,255,.025);
  border-color:rgba(177,186,177,.18);
  box-shadow:0 6px 18px rgba(0,0,0,.20);
  outline:none;
}

.event-date{
  position:relative;
  text-align:center;
  color:#b7b9ae;
  line-height:1;
  border-right:1px solid var(--line-soft);
  padding-right:10px;
}

.event-date .roman{
  display:block;
  color:#737c74;
  font-size:.64rem;
  letter-spacing:.1em;
  margin-bottom:4px;
}

.event-date strong{
  display:block;
  color:#e1e1d7;
  font-size:1.55rem;
  font-weight:600;
}

.event-copy{min-width:0}

.event-copy .label{
  display:block;
  color:#79837a;
  font-size:.65rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:3px;
}

.event-copy .title{
  display:block;
  color:#deded5;
  font-size:1.04rem;
  line-height:1.08;
}

/* =========================
   MODAL / PÁGINA DE CÓDICE
   ========================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:rgba(3,6,5,.90);
  opacity:0;
  visibility:hidden;
  transition:opacity .25s ease, visibility .25s ease;
}

.overlay.open{
  opacity:1;
  visibility:visible;
}

.modal{
  position:relative;
  width:min(920px, 100%);
  max-height:90vh;
  overflow:auto;
  padding:14px;
  /* CAMBIO 7: el fondo del modal ya NO es un azul fijo — usa el color de
     la casa del evento (--modal-bg), fijado por JS al abrir la tarjeta.
     El valor tras la coma es el respaldo (Ravenclaw) por si JS no corrió. */
  background:
    radial-gradient(ellipse at 50% 0%, rgba(78,109,88,.10), transparent 40%),
    var(--modal-bg, rgba(14,26,64,.78));
  border:1px solid rgba(207,207,192,.27);
  box-shadow:0 28px 80px rgba(0,0,0,.55);
  transform:translateY(16px) scale(.985);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);
}

.overlay.open .modal{
  transform:translateY(0) scale(1);
}

.modal-page{
  position:relative;
  display:grid;
  grid-template-columns:minmax(260px, .85fr) minmax(280px, 1.15fr);
  min-height:500px;
  border:1px solid rgba(210,210,194,.13);
  overflow:hidden;
}

.modal-page::before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(210,210,194,.08);
  pointer-events:none;
}

.modal-image{
  position:relative;
  min-height:500px;
  background:
    linear-gradient(180deg, rgba(15,31,22,.18), rgba(4,8,6,.70)),
    radial-gradient(circle at 50% 45%, rgba(73,116,88,.18), transparent 52%),
    #0a100c;
  overflow:hidden;
}

.modal-image img{
  display:block;
  width:100%;
  height:100%;
  min-height:500px;
  object-fit:cover;
  filter:saturate(.78) contrast(1.04) brightness(.82);
}

.modal-image::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg, rgba(7,13,10,.06), rgba(7,13,10,.48)),
    linear-gradient(0deg, rgba(7,13,10,.30), transparent 35%);
}

.image-placeholder{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:35px;
  text-align:center;
  color:#858f87;
  background:
    radial-gradient(circle, rgba(69,108,83,.16), transparent 48%),
    #0a100c;
}

.image-placeholder.visible{display:flex}

.image-placeholder .orn{
  font-size:45px;
  color:#718074;
  margin-bottom:12px;
}

.image-placeholder p{
  max-width:240px;
  margin:0;
  font-size:1rem;
  font-style:italic;
  line-height:1.4;
}

.modal-content{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:54px 50px 46px;
  /* CAMBIO 7: mismo criterio — color de casa dinámico, respaldo Ravenclaw */
  background:
    linear-gradient(90deg, rgba(215,212,196,.04), transparent 18%),
    var(--modal-content-bg, rgba(27,58,107,.68));
}

.close-btn{
  position:absolute;
  top:15px;
  right:17px;
  z-index:3;
  width:34px;
  height:34px;
  padding:0;
  border:1px solid rgba(200,200,186,.16);
  color:#aeb4ab;
  background:transparent;
  cursor:pointer;
  font-size:1rem;
  transition:background .2s ease, color .2s ease;
}

.close-btn:hover{
  color:#eee;
  background:rgba(255,255,255,.05);
}

.modal-date{
  color:#778178;
  font-size:.73rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  margin-bottom:8px;
}

.modal-title{
  margin:0;
  color:#eeece2;
  font-family:var(--blackletter);
  font-size:clamp(2.2rem, 5vw, 3.65rem);
  font-weight:400;
  line-height:.95;
}

.modal-rule{
  display:flex;
  align-items:center;
  gap:9px;
  margin:20px 0 22px;
  color:#778177;
}

.modal-rule span{
  width:54px;
  height:1px;
  background:var(--line);
}

.modal-rule b{font-weight:400}

.modal-desc{
  margin:0;
  color:#c2c4ba;
  font-size:1.16rem;
  line-height:1.62;
}

.modal-footer{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:27px;
  color:#758078;
  font-size:.7rem;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.house-mark{
  width:9px;
  height:9px;
  border:1px solid currentColor;
  transform:rotate(45deg);
  background:var(--event-color, var(--green));
  box-shadow:0 0 10px rgba(95,140,110,.12);
}

/* =========================
   DECORACIÓN
   ========================= */

.corner{
  position:absolute;
  width:42px;
  height:42px;
  color:#6f796f;
  opacity:.48;
  pointer-events:none;
}

.corner::before,
.corner::after{
  content:"";
  position:absolute;
  background:currentColor;
}

.corner.tl{top:16px;left:16px}
.corner.tr{top:16px;right:16px;transform:scaleX(-1)}
.corner.bl{bottom:16px;left:16px;transform:scaleY(-1)}
.corner.br{bottom:16px;right:16px;transform:scale(-1)}

.corner::before{
  top:0;left:0;width:1px;height:34px;
}

.corner::after{
  top:0;left:0;width:34px;height:1px;
}

.modal-symbol{
  position:absolute;
  top:25px;
  left:25px;
  color:#7a867c;
  font-size:13px;
  letter-spacing:.1em;
}

/* =========================
   RESPONSIVE
   ========================= */

@media (max-width:1050px){
  .months{grid-template-columns:repeat(2, minmax(0,1fr))}
}

@media (max-width:720px){
  .page{
    width:min(100% - 20px, 600px);
    padding-top:25px;
  }

  .months{grid-template-columns:1fr}

  .modal{
    padding:8px;
    max-height:94vh;
  }

  .modal-page{
    grid-template-columns:1fr;
  }

  .modal-image{
    min-height:270px;
    max-height:40vh;
  }

  .modal-image img{min-height:270px}

  .modal-content{
    padding:42px 28px 30px;
  }

  .modal-title{font-size:2.6rem}
}

@media (prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    scroll-behavior:auto !important;
    transition:none !important;
  }
}
</style>
</head>

<body>
<main class="page">

  <header class="header">
    <div class="header-ornament"> 🗡 </div>
    <h1>Pureblood Syndicate</h1>
    <p class="subtitle">Draco Dormiens Nunquam Titillandus</p>

    <div class="header-rule">
      <span></span>
      <b>𓆗</b>
      <span></span>
    </div>
  </header>

  <section class="months" id="months" aria-label="Calendario"></section>

</main>

<div class="overlay" id="overlay" aria-hidden="true">
  <article class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

    <button class="close-btn" id="closeBtn" aria-label="Cerrar">✕</button>

    <div class="modal-page">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>

      <div class="modal-image">
        <img id="modalImage" src="" alt="" hidden>

        <div class="image-placeholder" id="imagePlaceholder">
          <div class="orn">❦</div>
          <p id="placeholderText">
            Aquí aparecerá la ilustración, bandera o motivo que asignada a la fecha.
          </p>
        </div>
      </div>

      <div class="modal-content">
        <div class="modal-symbol">✦</div>

        <div class="modal-date" id="modalDate"></div>
        <h2 class="modal-title" id="modalTitle"></h2>

        <div class="modal-rule">
          <span></span>
          <b>❦</b>
          <span></span>
        </div>

        <p class="modal-desc" id="modalDesc"></p>

        <div class="modal-footer">
          <span class="house-mark" id="houseMark"></span>
          <span id="modalHouse"></span>
        </div>
      </div>
    </div>
  </article>
</div>

<script>
/*
  ==========================================
  DATOS
  ==========================================

  Para añadir una imagen a una fecha:

  image: 'images/octubre/03.jpg'

  Para una bandera, escudo, ilustración, etc.,
  simplemente usa la ruta que quieras.

  Si dejas image vacío (''), aparecerá el
  espacio de ilustración medieval en su lugar.
*/

const HOUSE = {
  slyt: {
    name: 'Slytherin',
    color: '#3f7655'
  },
  gryf: {
    name: 'Gryffindor',
    color: '#6e3732'
  },
  huff: {
    name: 'Hufflepuff',
    color: '#807047'
  },
  raven: {
    name: 'Ravenclaw',
    color: '#465d70'
  }
};

const data = {
  Octubre: [
    {
      day:'3',
      title:'Actividad de presentación',
      house:'slyt',
      image:'',
      desc:'Texto JAJS.'
    },
    {
      day:'10',
      title:'Un mes, una canción',
      house:'raven',
      image:'',
      desc:'Cada integrante elegira una canción que sienta identifica a su personaje. Es dia de juegos (Verdad o reto, gifs) en la casa Ravenclaw'
    },
    {
      day:'17',
      title:'Día libre',
      house:'huff',
      image:'',
      desc:'Este dia es libre para conversar.'
    },
    {
      day:'24',
      title:'Día de Gifs',
      house:'gryf',
      image:'',
      desc:'Cosas coquetas.'
    }
  ],

  Noviembre: [
    {
      day:'7',
      title:'Un mes, una canción',
      house:'slyt',
      image:'',
      desc:'Cada integrante elegira una canción que sienta identifica a su personaje. Es dia de juegos (Verdad o reto, gifs) en la casa slytherin.'
    },
    {
      day:'14',
      title:'Sabado de fiesta',
      house:'gryf',
      image:'',
      desc:'Fiesta en la casa gryffindor.'
    },
    {
      day:'21',
      title:'Actividad secreta',
      house:'slyt',
      image:'',
      desc:'Cada estudiante de la casa recibe, en privado, una frase escrita por un estudiante anonimo. Nadie sabe quién las escribió.'
    },
    {
      day:'28',
      title:'Reto',
      house:'raven',
      image:'',
      desc:'Muestra un mensaje destacado.'
    }
  ],

  Diciembre: [
    {
      day:'5',
      title:'Dia libre',
      house:'slyt',
      image:'',
      desc:'Freeeee.'
    },
    {
      day:'12',
      title:'Un mes, una canción',
      house:'huff',
      image:'',
      desc:'Ya saben lo que significa, fiesta en la casa Hufflepuff.'
    },
    {
      day:'19',
      title:'Por definir',
      house:'slyt',
      image:'',
      desc:'.'
    },
    {
      day:'26',
      title:'Navidad ❄',
      house:'huff',
      image:'',
      desc:'Un dia de regalos, piensa en la persona especial a quien regalaras'
    }
  ],

  Enero: [
    {
      day:'3',
      title:'Por definir',
      house:'raven',
      image:'',
      desc:'.'
    },
    {
      day:'10',
      title:'Un mes, una canción ❧',
      house:'slyt',
      image:'',
      desc:'Es el cumpleaños de Snape, así que preparense para una fiesta en Slytherin.'
    },
    {
      day:'17',
      title:'Exámenes',
      house:'slyt',
      image:'',
      desc:'Todo mal.'
    },
    {
      day:'24',
      title:'Celebrando no haber muerto para este punto',
      house:'gryf',
      image:'',
      desc:'Fiesta en Hogwarts.'
    }, 
    {
      day:'31',
      title:'Dia libre',
      house:'gryf',
      image:'',
      desc:'.'
    }
  ]
};

const monthsEl = document.getElementById('months');

const roman = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

Object.entries(data).forEach(([month, events], monthIndex) => {

  const col = document.createElement('section');
  col.className = 'month';

  col.innerHTML = `
    <div class="month-head">
      <span class="month-number">Libro ${roman[monthIndex]}</span>
      <h2>${month}</h2>
    </div>
    <div class="rows"></div>
  `;

  const rows = col.querySelector('.rows');

  events.forEach(ev => {

    const p = document.createElement('button');
    p.type = 'button';
    p.className = 'plaque';
    p.style.setProperty('--event-color', HOUSE[ev.house].color);

    p.innerHTML = `
      <span class="event-date">
        <span class="roman">${toRoman(Number(ev.day))}</span>
        <strong>${ev.day}</strong>
      </span>
      <span class="event-copy">
        <span class="label">${month}</span>
        <span class="title">${ev.title}</span>
      </span>
    `;

    p.addEventListener('click', () => openModal(ev, month));
    rows.appendChild(p);
  });

  monthsEl.appendChild(col);
});

function toRoman(num){
  const values = [
    [1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],
    [100,'C'],[90,'XC'],[50,'L'],[40,'XL'],
    [10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']
  ];

  let result = '';

  for(const [value, symbol] of values){
    while(num >= value){
      result += symbol;
      num -= value;
    }
  }

  return result;
}

const overlay = document.getElementById('overlay');
const modalEl = document.querySelector('.modal');
const modalImage = document.getElementById('modalImage');
const imagePlaceholder = document.getElementById('imagePlaceholder');

/* CAMBIO 7: convierte un color hex (#3f7655) a "rgba(r,g,b,alpha)"
   para poder aplicar el color de cada casa con transparencia al modal. */
function hexToRgba(hex, alpha){
  const clean = hex.replace('#','');
  const r = parseInt(clean.substring(0,2), 16);
  const g = parseInt(clean.substring(2,4), 16);
  const b = parseInt(clean.substring(4,6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function openModal(ev, month){

  const house = HOUSE[ev.house];

  /* CAMBIO 7: la tarjeta del modal toma el color de la casa del evento
     (translúcido) en vez de un azul fijo. El panel de contenido usa
     una alpha un poco menor para dar sensación de profundidad. */
  modalEl.style.setProperty('--modal-bg', hexToRgba(house.color, 0.78));
  modalEl.style.setProperty('--modal-content-bg', hexToRgba(house.color, 0.66));

  document.getElementById('modalDate').textContent =
    `${ev.day} de ${month}`;

  document.getElementById('modalTitle').textContent =
    ev.title;

  document.getElementById('modalDesc').textContent =
    ev.desc;

  document.getElementById('modalHouse').textContent =
    house.name;

  document.getElementById('houseMark').style.setProperty(
    '--event-color',
    house.color
  );

  /*
    Imagen:
    - si existe, aparece
    - si no existe, aparece el espacio reservado
      para tu futura ilustración.
  */
  modalImage.onload = () => {
    modalImage.hidden = false;
    imagePlaceholder.classList.remove('visible');
  };

  modalImage.onerror = () => {
    modalImage.hidden = true;
    imagePlaceholder.classList.add('visible');
  };

  if(ev.image){
    modalImage.alt = `${ev.title} — ilustración`;
    modalImage.src = ev.image;
  }else{
    modalImage.hidden = true;
    imagePlaceholder.classList.add('visible');
  }

  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}

document.getElementById('closeBtn')
  .addEventListener('click', closeModal);

overlay.addEventListener('click', e => {
  if(e.target === overlay) closeModal();
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});
</script>

</body>
</html>
