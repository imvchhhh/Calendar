<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hogwarts — Pureblood Syndicate </title>

<!-- Tipografías: gótica para títulos y serif editorial para el contenido -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#e7e4d8;
  --ink-soft:#b9b9aa;
  --paper:#d7d4c4;
  --paper-dark:#aaa896;

  --bg:#080d0b;
  --bg-2:#0b120e;
  --panel:#101713;
  --panel-2:#141d17;

  --green:#315d45;
  --green-light:#5f8c6e;
  --green-deep:#183526;
  --silver:#9da49c;

  --line:rgba(214,211,192,.30);
  --line-soft:rgba(214,211,192,.13);
  --glow:rgba(95,140,110,.18);

  --serif:'Cormorant Garamond', Georgia, serif;
  --blackletter:'UnifrakturMaguntia', 'Times New Roman', serif;

  box-sizing:border-box;
}

*,
*::before,
*::after{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:var(--serif);
  background:
    radial-gradient(ellipse at 50% -15%, rgba(48,88,65,.18), transparent 48%),
    radial-gradient(ellipse at 50% 110%, rgba(20,42,30,.20), transparent 42%),
    var(--bg);
  overflow-x:hidden;
}

/* Textura muy leve: evita el aspecto de "gradiente de IA" */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.035;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.5) 0 1px, transparent 1px 5px);
  mix-blend-mode:soft-light;
}

button{font:inherit}

.page{
  width:min(1280px, calc(100% - 34px));
  margin:0 auto;
  padding:38px 0 70px;
}

/* =========================
   CABECERA
   ========================= */

.header{
  position:relative;
  text-align:center;
  padding:8px 0 30px;
}

.header::before,
.header::after{
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:min(700px, 90%);
  height:1px;
  background:linear-gradient(90deg, transparent, var(--line), transparent);
}

.header::before{top:0}
.header::after{bottom:0}

.header-ornament{
  color:var(--silver);
  font-size:18px;
  letter-spacing:.55em;
  opacity:.72;
  margin-bottom:8px;
}

h1{
  margin:0;
  color:#f0eee5;
  font-family:var(--blackletter);
  font-size:clamp(3rem, 8vw, 6.7rem);
  font-weight:400;
  line-height:.88;
  letter-spacing:.015em;
  text-shadow:0 1px 0 #000;
}

.banner{
  position:relative;
  width:min(430px, 82%);
  margin:18px auto 0;
  padding:13px 42px 16px;
  color:#e5e2d7;
  background:#17251c;
  border:1px solid rgba(210,210,190,.28);
  border-top:2px solid rgba(210,210,190,.42);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.28),
    0 7px 16px rgba(0,0,0,.22);
  font-family:var(--serif);
  font-size:clamp(.72rem, 1.3vw, .9rem);
  font-style:italic;
  letter-spacing:.13em;
  text-transform:uppercase;
}

.banner::before,
.banner::after{
  content:"";
  position:absolute;
  bottom:-18px;
  width:0;
  height:0;
  border-style:solid;
}

.banner::before{
  left:-1px;
  border-width:18px 30px 0 0;
  border-color:#17251c transparent transparent transparent;
}

.banner::after{
  right:-1px;
  border-width:18px 0 0 30px;
  border-color:#17251c transparent transparent transparent;
}

.banner span::before,
.banner span::after{
  content:"❦";
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  color:#7f8a80;
  font-size:.65rem;
}

.banner span::before{left:14px}
.banner span::after{right:14px}

.header-rule{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
  margin:18px auto 0;
  color:#9ea69d;
  opacity:.72;
}

/* =================================
   ESCUDO / CABECERA HERÁLDICA
   ================================= */

/* Ajuste: cabecera heráldica más pequeña */

.hogwarts-emblem{
  width:min(430px, 78%);
}

.top-scroll{
  width:84%;
  min-height:62px;
  padding:10px 38px 13px;
}

.top-scroll h1{
  font-size:clamp(2.5rem, 6vw, 4.4rem);
}

.top-scroll .fold{
  width:32px;
  top:8px;
  bottom:8px;
}

.crest-image{
  width:58%;
  margin-top:-2px;
  margin-bottom:-2px;
}

.bottom-scroll{
  width:84%;
  min-height:52px;
  padding:9px 34px 13px;
}

.bottom-scroll .fold{
  width:34px;
  top:8px;
  bottom:8px;
}

.motto{
  font-size:clamp(.55rem, 1.1vw, .75rem);
  letter-spacing:.09em;
}


/* ================================
   ESTANDARTE SUPERIOR
   ================================ */

.top-scroll{
  position:relative;
  z-index:3;

  width:88%;
  min-height:92px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:16px 55px 20px;

  background:
    linear-gradient(
      90deg,
      #111c15 0%,
      #263b2b 45%,
      #1a2b20 100%
    );

  border:1px solid rgba(215,212,196,.42);

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.35),
    0 8px 18px rgba(0,0,0,.28);

  clip-path:polygon(
    7% 0,
    93% 0,
    100% 17%,
    94% 50%,
    100% 83%,
    93% 100%,
    7% 100%,
    0 83%,
    6% 50%,
    0 17%
  );
}


.top-scroll h1{
  position:relative;
  z-index:2;

  margin:0;

  color:#f0eee5;
  font-family:var(--blackletter);
  font-size:clamp(3.4rem, 8vw, 6rem);
  font-weight:400;
  line-height:.85;

  text-shadow:
    0 2px 0 #080d0b,
    1px 0 0 rgba(255,255,255,.08);
}


/* Pliegues de los extremos */

.top-scroll .fold{
  position:absolute;
  top:12px;
  bottom:12px;
  width:46px;

  background:#0c1710;
  opacity:.8;
}

.top-scroll .fold-left{
  left:0;

  clip-path:polygon(
    100% 0,
    35% 15%,
    0 50%,
    35% 85%,
    100% 100%
  );

  box-shadow:inset -8px 0 10px rgba(0,0,0,.35);
}

.top-scroll .fold-right{
  right:0;

  clip-path:polygon(
    0 0,
    65% 15%,
    100% 50%,
    65% 85%,
    0 100%
  );

  box-shadow:inset 8px 0 10px rgba(0,0,0,.35);
}


/* ================================
   IMAGEN CENTRAL
   ================================ */

.crest-image{
  position:relative;
  z-index:2;

  margin-top:-4px;
  margin-bottom:-4px;

  width:72%;
  aspect-ratio:1 / 1;

  display:flex;
  justify-content:center;
  align-items:center;
}


.image-frame{
  position:relative;

  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle,
      rgba(49,93,69,.18),
      transparent 68%
    );
}


/* Aquí aparecerá tu futura imagen */

.image-frame img{
  position:relative;
  z-index:2;

  display:block;

  width:88%;
  height:88%;

  object-fit:contain;

  filter:
    saturate(.72)
    contrast(1.04);
}


/* Mientras no haya imagen */

.image-placeholder{
  position:absolute;
  inset:12%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#69766c;
  font-size:3rem;

  border:1px solid rgba(210,210,194,.13);

  background:
    radial-gradient(
      circle,
      rgba(49,93,69,.14),
      transparent 65%
    );
}


/* ================================
   ESTANDARTE INFERIOR
   ================================ */

.bottom-scroll{
  position:relative;
  z-index:3;

  width:88%;
  min-height:76px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:13px 52px 19px;

  background:
    linear-gradient(
      90deg,
      #101b14,
      #263b2b 48%,
      #101b14
    );

  border:1px solid rgba(215,212,196,.38);

  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.32),
    0 7px 16px rgba(0,0,0,.25);

  clip-path:polygon(
    7% 0,
    93% 0,
    100% 18%,
    94% 50%,
    100% 82%,
    91% 100%,
    77% 78%,
    63% 100%,
    50% 78%,
    37% 100%,
    23% 78%,
    9% 100%,
    0 82%,
    6% 50%,
    0 18%
  );
}


.motto{
  position:relative;
  z-index:2;

  color:#d9d8ce;

  font-family:var(--serif);
  font-size:clamp(.65rem, 1.35vw, .9rem);

  font-weight:600;
  letter-spacing:.11em;

  text-transform:uppercase;
  text-align:center;
}


/* Pliegues inferiores */

.bottom-scroll .fold{
  position:absolute;
  top:12px;
  bottom:12px;
  width:48px;

  background:#0b160f;
  opacity:.82;
}

.bottom-scroll .fold-left{
  left:0;

  clip-path:polygon(
    100% 0,
    35% 15%,
    0 50%,
    35% 85%,
    100% 100%
  );
}

.bottom-scroll .fold-right{
  right:0;

  clip-path:polygon(
    0 0,
    65% 15%,
    100% 50%,
    65% 85%,
    0 100%
  );
}

.header-rule span{
  width:115px;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--line));
}

.header-rule span:last-child{
  transform:scaleX(-1);
}

.header-rule b{
  font-weight:400;
  font-size:15px;
}

/* =========================
   LIBRO / MESES
   ========================= */

.months{
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  gap:18px;
  margin-top:34px;
}

.month{
  position:relative;
  min-height:100%;
  padding:19px 16px 21px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.018), transparent 30%),
    linear-gradient(160deg, var(--panel-2), var(--panel));
  border:1px solid var(--line-soft);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.45),
    0 12px 30px rgba(0,0,0,.18);
}

.month::before{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid rgba(210,210,192,.09);
  pointer-events:none;
}

.month::after{
  content:"❦";
  position:absolute;
  left:50%;
  top:-12px;
  transform:translateX(-50%);
  padding:0 9px;
  color:#8e978d;
  background:var(--bg);
  font-size:18px;
  opacity:.8;
}

.month-head{
  position:relative;
  z-index:1;
  text-align:center;
  padding:0 4px 17px;
  border-bottom:1px solid var(--line-soft);
}

.month-number{
  display:block;
  color:#778078;
  font-size:.72rem;
  letter-spacing:.24em;
  text-transform:uppercase;
  margin-bottom:3px;
}

.month h2{
  margin:0;
  color:#e2e1d8;
  font-family:var(--blackletter);
  font-size:clamp(1.65rem, 2.4vw, 2.15rem);
  font-weight:400;
  line-height:1;
}

.rows{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding-top:15px;
}

/* =========================
   EVENTOS
   ========================= */

.plaque{
  position:relative;
  display:grid;
  grid-template-columns:54px 1fr;
  align-items:center;
  gap:10px;
  min-height:72px;
  padding:9px 10px 9px 7px;
  color:var(--ink);
  background:
    linear-gradient(90deg, rgba(36,67,49,.13), transparent 55%),
    rgba(0,0,0,.14);
  border:1px solid transparent;
  border-left:1px solid rgba(105,134,114,.30);
  cursor:pointer;
  transition:
    transform .22s ease,
    background .22s ease,
    border-color .22s ease,
    box-shadow .22s ease;
}

.plaque::before{
  content:"";
  position:absolute;
  top:7px;
  bottom:7px;
  left:0;
  width:2px;
  background:var(--event-color, var(--green));
  opacity:.72;
}

.plaque:hover,
.plaque:focus-visible{
  transform:translateX(3px);
  background:
    linear-gradient(90deg, rgba(49,93,69,.24), transparent 70%),
    rgba(255,255,255,.025);
  border-color:rgba(177,186,177,.18);
  box-shadow:0 6px 18px rgba(0,0,0,.20);
  outline:none;
}

.event-date{
  position:relative;
  text-align:center;
  color:#b7b9ae;
  line-height:1;
  border-right:1px solid var(--line-soft);
  padding-right:10px;
}

.event-date .roman{
  display:block;
  color:#737c74;
  font-size:.64rem;
  letter-spacing:.1em;
  margin-bottom:4px;
}

.event-date strong{
  display:block;
  color:#e1e1d7;
  font-size:1.55rem;
  font-weight:600;
}

.event-copy{min-width:0}

.event-copy .label{
  display:block;
  color:#79837a;
  font-size:.65rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:3px;
}

.event-copy .title{
  display:block;
  color:#deded5;
  font-size:1.04rem;
  line-height:1.08;
}

/* =========================
   MODAL / PÁGINA DE CÓDICE
   ========================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px;
  background:rgba(3,6,5,.90);
  opacity:0;
  visibility:hidden;
  transition:opacity .25s ease, visibility .25s ease;
}

.overlay.open{
  opacity:1;
  visibility:visible;
}

.modal{
  position:relative;
  width:min(920px, 100%);
  max-height:90vh;
  overflow:auto;
  padding:14px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(78,109,88,.10), transparent 40%),
    #111813;
  border:1px solid rgba(207,207,192,.27);
  box-shadow:0 28px 80px rgba(0,0,0,.55);
  transform:translateY(16px) scale(.985);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);
}

.overlay.open .modal{
  transform:translateY(0) scale(1);
}

.modal-page{
  position:relative;
  display:grid;
  grid-template-columns:minmax(260px, .85fr) minmax(280px, 1.15fr);
  min-height:500px;
  border:1px solid rgba(210,210,194,.13);
  overflow:hidden;
}

.modal-page::before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(210,210,194,.08);
  pointer-events:none;
}

.modal-image{
  position:relative;
  min-height:500px;
  background:
    linear-gradient(180deg, rgba(15,31,22,.18), rgba(4,8,6,.70)),
    radial-gradient(circle at 50% 45%, rgba(73,116,88,.18), transparent 52%),
    #0a100c;
  overflow:hidden;
}

.modal-image img{
  display:block;
  width:100%;
  height:100%;
  min-height:500px;
  object-fit:cover;
  filter:saturate(.78) contrast(1.04) brightness(.82);
}

.modal-image::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg, rgba(7,13,10,.06), rgba(7,13,10,.48)),
    linear-gradient(0deg, rgba(7,13,10,.30), transparent 35%);
}

.image-placeholder{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:35px;
  text-align:center;
  color:#858f87;
  background:
    radial-gradient(circle, rgba(69,108,83,.16), transparent 48%),
    #0a100c;
}

.image-placeholder.visible{display:flex}

.image-placeholder .orn{
  font-size:45px;
  color:#718074;
  margin-bottom:12px;
}

.image-placeholder p{
  max-width:240px;
  margin:0;
  font-size:1rem;
  font-style:italic;
  line-height:1.4;
}

.modal-content{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:54px 50px 46px;
  background:
    linear-gradient(90deg, rgba(215,212,196,.025), transparent 18%),
    #121a15;
}

.close-btn{
  position:absolute;
  top:15px;
  right:17px;
  z-index:3;
  width:34px;
  height:34px;
  padding:0;
  border:1px solid rgba(200,200,186,.16);
  color:#aeb4ab;
  background:transparent;
  cursor:pointer;
  font-size:1rem;
  transition:background .2s ease, color .2s ease;
}

.close-btn:hover{
  color:#eee;
  background:rgba(255,255,255,.05);
}

.modal-date{
  color:#778178;
  font-size:.73rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  margin-bottom:8px;
}

.modal-title{
  margin:0;
  color:#eeece2;
  font-family:var(--blackletter);
  font-size:clamp(2.2rem, 5vw, 3.65rem);
  font-weight:400;
  line-height:.95;
}

.modal-rule{
  display:flex;
  align-items:center;
  gap:9px;
  margin:20px 0 22px;
  color:#778177;
}

.modal-rule span{
  width:54px;
  height:1px;
  background:var(--line);
}

.modal-rule b{font-weight:400}

.modal-desc{
  margin:0;
  color:#c2c4ba;
  font-size:1.16rem;
  line-height:1.62;
}

.modal-footer{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:27px;
  color:#758078;
  font-size:.7rem;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.house-mark{
  width:9px;
  height:9px;
  border:1px solid currentColor;
  transform:rotate(45deg);
  background:var(--event-color, var(--green));
  box-shadow:0 0 10px rgba(95,140,110,.12);
}

/* =========================
   DECORACIÓN
   ========================= */

.corner{
  position:absolute;
  width:42px;
  height:42px;
  color:#6f796f;
  opacity:.48;
  pointer-events:none;
}

.corner::before,
.corner::after{
  content:"";
  position:absolute;
  background:currentColor;
}

.corner.tl{top:16px;left:16px}
.corner.tr{top:16px;right:16px;transform:scaleX(-1)}
.corner.bl{bottom:16px;left:16px;transform:scaleY(-1)}
.corner.br{bottom:16px;right:16px;transform:scale(-1)}

.corner::before{
  top:0;left:0;width:1px;height:34px;
}

.corner::after{
  top:0;left:0;width:34px;height:1px;
}

.modal-symbol{
  position:absolute;
  top:25px;
  left:25px;
  color:#7a867c;
  font-size:13px;
  letter-spacing:.1em;
}

/* =========================
   RESPONSIVE
   ========================= */

@media (max-width:1050px){
  .months{grid-template-columns:repeat(2, minmax(0,1fr))}
}

@media (max-width:720px){
  .page{
    width:min(100% - 20px, 600px);
    padding-top:25px;
  }

  .months{grid-template-columns:1fr}

  .modal{
    padding:8px;
    max-height:94vh;
  }

  .modal-page{
    grid-template-columns:1fr;
  }

  .modal-image{
    min-height:270px;
    max-height:40vh;
  }

  .modal-image img{min-height:270px}

  .modal-content{
    padding:42px 28px 30px;
  }

  .modal-title{font-size:2.6rem}
}

@media (prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    scroll-behavior:auto !important;
    transition:none !important;
  }
}
</style>
</head>

<body>
<main class="page">

  <header class="header">

  <div class="hogwarts-emblem">

    <!-- ESTANDARTE SUPERIOR -->
    <div class="top-scroll">
      <span class="fold fold-left"></span>

      <h1>Hogwarts</h1>

      <span class="fold fold-right"></span>
    </div>

    <!-- IMAGEN CENTRAL -->
    <div class="crest-image">
      <div class="image-frame">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <!-- Cuando tengas la imagen, ponla aquí -->
        <img src="imagenes/imagen 1.png" alt="Escudo de Hogwarts" id="hogwartsImage">

        <div class="image-placeholder">
          ✦
        </div>
      </div>
    </div>

    <!-- ESTANDARTE INFERIOR -->
    <div class="bottom-scroll">
      <span class="fold fold-left"></span>

      <span class="motto">
        Draco Dormiens Nunquam Titillandus
      </span>

      <span class="fold fold-right"></span>
    </div>

  </div>

</header>

  <section class="months" id="months" aria-label="Calendario"></section>

</main>

<div class="overlay" id="overlay" aria-hidden="true">
  <article class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

    <button class="close-btn" id="closeBtn" aria-label="Cerrar">✕</button>

    <div class="modal-page">
      <span class="corner tl"></span>

      <span class="corner br"></span>

      <div class="modal-image">

        <div class="image-placeholder" id="imagePlaceholder">

          <p id="placeholderText">
            Aquí aparecerá la ilustración, bandera o motivo que asignada a la fecha.
          </p>
        </div>
      </div>

      <div class="modal-content">

        </div>
      </div>
    </div>
  </article>
</div>

<script>

const monthsEl = document.getElementById('months');

const roman = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];

Object.entries(data).forEach(([month, events], monthIndex) => {

  const col = document.createElement('section');
  col.className = 'month';

  col.innerHTML = `
    <div class="month-head">
      <span class="month-number">Libro ${roman[monthIndex]}</span>
      <h2>${month}</h2>
    </div>
    <div class="rows"></div>
  `;

  const rows = col.querySelector('.rows');

  events.forEach(ev => {

    const p = document.createElement('button');
    p.type = 'button';
    p.className = 'plaque';
    p.style.setProperty('--event-color', HOUSE[ev.house].color);

    p.innerHTML = `
      <span class="event-date">
        <span class="roman">${toRoman(Number(ev.day))}</span>
        <strong>${ev.day}</strong>
      </span>
      <span class="event-copy">
        <span class="label">${month}</span>
        <span class="title">${ev.title}</span>
      </span>
    `;

    p.addEventListener('click', () => openModal(ev, month));
    rows.appendChild(p);
  });

  monthsEl.appendChild(col);
});

function toRoman(num){
  const values = [
    [1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],
    [100,'C'],[90,'XC'],[50,'L'],[40,'XL'],
    [10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']
  ];

  let result = '';

  for(const [value, symbol] of values){
    while(num >= value){
      result += symbol;
      num -= value;
    }
  }

  return result;
}

const overlay = document.getElementById('overlay');
const modalImage = document.getElementById('modalImage');
const imagePlaceholder = document.getElementById('imagePlaceholder');

function openModal(ev, month){

  const house = HOUSE[ev.house];

  document.getElementById('modalDate').textContent =
    `${ev.day} de ${month}`;

  document.getElementById('modalTitle').textContent =
    ev.title;

  document.getElementById('modalDesc').textContent =
    ev.desc;

  document.getElementById('modalHouse').textContent =
    house.name;

  document.getElementById('houseMark').style.setProperty(
    '--event-color',
    house.color
  );

  /*
    Imagen:
    - si existe, aparece
    - si no existe, aparece el espacio reservado
      para tu futura ilustración.
  */
  modalImage.onload = () => {
    modalImage.hidden = false;
    imagePlaceholder.classList.remove('visible');
  };

  modalImage.onerror = () => {
    modalImage.hidden = true;
    imagePlaceholder.classList.add('visible');
  };

  if(ev.image){
    modalImage.alt = `${ev.title} — ilustración`;
    modalImage.src = ev.image;
  }else{
    modalImage.hidden = true;
    imagePlaceholder.classList.add('visible');
  }

  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}

document.getElementById('closeBtn')
  .addEventListener('click', closeModal);

overlay.addEventListener('click', e => {
  if(e.target === overlay) closeModal();
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});
